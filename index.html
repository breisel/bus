<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>バス接近情報</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        -webkit-text-size-adjust: 100%;
    }

    body {
        margin: 0;
        padding: 0;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Noto Sans JP",
            sans-serif;

        background: #f4f6f8;
        color: #222;
    }

    .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        padding:
            calc(18px + env(safe-area-inset-top))
            16px
            calc(30px + env(safe-area-inset-bottom));
    }

    /* ヘッダー */
    header {
        margin-bottom: 20px;
    }

    .title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0;
    }

    .subtitle {
        margin-top: 5px;
        font-size: 13px;
        color: #777;
    }

    /* セクション */
    .section {
        margin-top: 24px;
    }

    .section-title {
        display: flex;
        align-items: center;
        gap: 8px;

        font-size: 15px;
        font-weight: 700;
        color: #555;

        margin: 0 0 10px 4px;
    }

    /* カード */
    .bus-card {
        display: block;

        background: #fff;
        border-radius: 18px;

        padding: 17px 17px 16px;
        margin-bottom: 12px;

        text-decoration: none;
        color: inherit;

        box-shadow:
            0 2px 8px rgba(0,0,0,0.06);

        transition:
            transform 0.12s ease,
            box-shadow 0.12s ease;

        -webkit-tap-highlight-color: transparent;
    }

    .bus-card:active {
        transform: scale(0.975);
        box-shadow:
            0 1px 4px rgba(0,0,0,0.08);
    }

    /* メインカード */
    .main-card {
        padding: 20px 18px;
    }

    .main-card .route {
        font-size: 18px;
        font-weight: 750;
    }

    .main-card .arrow {
        font-size: 20px;
        margin: 0 4px;
    }

    /* アイコン */
    .icon {
        width: 42px;
        height: 42px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 12px;

        background: #f0f2f5;

        font-size: 21px;

        flex-shrink: 0;
    }

    .card-row {
        display: flex;
        align-items: center;
        gap: 13px;
    }

    /* テキスト */
    .card-content {
        min-width: 0;
        flex: 1;
    }

    .label {
        font-size: 12px;
        font-weight: 700;
        color: #777;
        margin-bottom: 4px;
    }

    .route {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.4;
    }

    .arrow {
        color: #999;
        margin: 0 3px;
    }

    .open {
        color: #999;
        font-size: 20px;
        margin-left: 5px;
    }

    /* 出勤 */
    .work-card {
        background: linear-gradient(
            135deg,
            #ffffff,
            #f8fbff
        );
    }

    .work-card .icon {
        background: #e8f1ff;
    }

    /* 退勤 */
    .home-card {
        background: linear-gradient(
            135deg,
            #ffffff,
            #fff9f0
        );
    }

    .home-card .icon {
        background: #fff0d8;
    }

    /* その他 */
    .other-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .small-card {
        margin-bottom: 0;
        min-height: 128px;
        padding: 16px;
    }

    .small-card .card-row {
        height: 100%;
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
    }

    .small-card .icon {
        width: 38px;
        height: 38px;
        font-size: 19px;
    }

    .small-card .route {
        font-size: 14px;
        line-height: 1.55;
    }

    .small-card .open {
        display: none;
    }

    /* 戻る/補足 */
    .note {
        text-align: center;
        color: #999;
        font-size: 11px;
        margin-top: 25px;
        line-height: 1.6;
    }

    /* タブレット以上 */
    @media (min-width: 601px) {
        body {
            padding-top: 20px;
        }

        .container {
            padding-top: 25px;
        }
    }

    /* ダークモード */
    @media (prefers-color-scheme: dark) {
        body {
            background: #111315;
            color: #eee;
        }

        .subtitle,
        .section-title,
        .label,
        .note {
            color: #999;
        }

        .bus-card {
            background: #1b1e21;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.25);
        }

        .work-card {
            background: #1b2028;
        }

        .home-card {
            background: #211f1b;
        }

        .icon {
            background: #292d31;
        }

        .work-card .icon {
            background: #24354d;
        }

        .home-card .icon {
            background: #44351f;
        }

        .open,
        .arrow {
            color: #777;
        }
    }
</style>
</head>
